name = "ghichucanhancloudflared1"
main = "worker/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Tự động build frontend bằng Vite trước khi wrangler đọc thư mục ./dist
[build]
command = "npm run build"

# Cấu hình phục vụ frontend đã build từ Vite qua Cloudflare Workers Static Assets
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*"]

# Cấu hình binding cơ sở dữ liệu Cloudflare D1
# Sau khi chạy `wrangler d1 create notes-db`, hãy thay database_id bằng ID thật của bạn
[[d1_databases]]
binding = "DB"
database_name = "notes-db"
database_id = "ce87fad6-b6d5-46f1-b713-3d0aa3355ad6"

# Biến môi trường không nhạy cảm
[vars]
FIREBASE_PROJECT_ID = "fast-tribute-0c62s"

# Khóa bí mật (tùy chọn, nên đặt trên production để ký session cookie):
# npx wrangler secret put AUTH_SECRET
